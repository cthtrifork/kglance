<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KGlance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The backdrop is the whole (transparent) window. With layer-shell it covers the screen, and a click on it, outside the card, closes the popup. -->
    <div id="backdrop">
      <main id="card">
        <section class="clock">
          <div class="time"><span id="time">--:--</span><span id="seconds"></span></div>
          <div id="date"></div>
        </section>
        <hr />
        <section id="power" data-kind="ac" data-low="false">
          <div class="power-main">
            <svg class="icon icon-battery" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="7" width="17" height="10" rx="2" />
              <path d="M22 11v2" />
            </svg>
            <svg class="icon icon-charging" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="7" width="17" height="10" rx="2" />
              <path d="M22 11v2M11.5 9.5L8.5 12.5h4l-3 3" />
            </svg>
            <svg class="icon icon-ac" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5" />
            </svg>
            <div class="power-text">
              <div id="power-title" class="title"></div>
              <div id="power-detail" class="detail"></div>
            </div>
          </div>
          <div id="power-bar" class="bar" hidden><div id="power-fill" class="fill"></div></div>
        </section>
        <hr id="memory-rule" hidden />
        <section id="memory" data-level="normal" hidden>
          <div class="power-main">
            <svg class="icon icon-chip" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="5" width="14" height="14" rx="2" />
              <rect x="9" y="9" width="6" height="6" rx="1" />
              <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" />
            </svg>
            <div class="power-text">
              <div id="memory-title" class="title"></div>
              <div id="memory-detail" class="detail"></div>
            </div>
          </div>
          <div class="bar"><div id="memory-fill" class="fill"></div></div>
        </section>
        <div id="update" data-kind="unknown"><i></i><span id="update-text">OS update: …</span></div>
        <footer>
          <span id="shortcut-hint"><span id="shortcut">Meta+Alt+G</span> to toggle</span>
          <span>Esc to close</span>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
