name: Release

# Publishes a GitHub release with exactly two downloads, built on Fedora 44: the `kglance_linux_amd64`
# binary and the `kglance-<version>-1.x86_64.rpm`, plus SHA256SUMS, a CycloneDX SBOM and signed
# build-provenance attestations (for the binary, the rpm and the SBOM; the SBOM is bound to the
# binary). Three ways to run it:
#   - the "Tag and release" workflow calls this one (workflow_call) with a new version and the commit
#     to release. This is the normal route. The tag does not exist yet: the release is published with
#     that commit as its target, and GitHub creates the tag then.
#   - pushing a tag like v1.2.3 (or v1.2.3-rc.1 for a pre-release) from a machine, which triggers it
#   - running it by hand (workflow_dispatch) on a branch for a dry run that builds but does not
#     publish. Dispatched on a tag ref it publishes, which also retries a release that failed.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The version to release (v1.2.3 or v1.2.3-rc.1); created at sha when the release is published
        required: true
        type: string
      sha:
        description: The commit to build and tag. Empty means the tag must already exist and is built as it is.
        required: false
        type: string

permissions:
  contents: read

# Two runs for the same tag must not publish at once; a started release is never cancelled.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  APP: kglance
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2

jobs:
  # The version and the "is this a real release" decision, on their own so the checks and the build
  # can start at once instead of queueing behind one job.
  meta:
    name: version
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called with a commit, build exactly that; with only a tag, that tag; otherwise the ref that triggered the run.
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # publish=true when there is a tag to release, false for a dry run on a branch.
          if [ -n "$INPUT_TAG" ]; then
            version="$INPUT_TAG"; publish=true
          elif [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"; publish=true
          else
            version="v0.0.0-dryrun.$(git rev-parse --short HEAD)"; publish=false
          fi
          if [ "$publish" = true ] && ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$version' is not a semantic version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Releases must come from main
        if: steps.meta.outputs.publish == 'true'
        run: |
          git fetch --no-tags origin main
          # HEAD is the commit being released (checked out above), whichever way this run started.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Released commit is not on main"; exit 1
          fi

  # Never ship something CI would have rejected. Runs beside the build; the release waits for it.
  checks:
    name: vet, test, govulncheck
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: ${{ needs.meta.outputs.publish != 'true' }} # off when publishing: a restored cache could poison the release; on for dry runs # zizmor: ignore[cache-poisoning]
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Vet and test
        run: make vet test

      - name: govulncheck
        env:
          CGO_ENABLED: '0'
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" -tags purego ./...

  build:
    name: build on Fedora 44
    needs: meta
    # The binary loads GTK4 and WebKitGTK at run time, so the container decides which libraries the
    # rpm is checked against, and Fedora 44 is the only supported platform.
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:17c99e30075386f9385685a22ad1924e2c22faee5863272c0379c81b80b9d258
    timeout-minutes: 25
    steps:
      - name: Install tools and the runtime libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False make git tar gzip \
            gtk4 webkitgtk6.0 libsoup3 gtk4-layer-shell
          grep PRETTY_NAME /etc/os-release

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          check-latest: true
          cache: ${{ needs.meta.outputs.publish != 'true' }} # off when publishing: a restored cache could poison the release; on for dry runs # zizmor: ignore[cache-poisoning]
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Build
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          go version
          mkdir -p dist
          make build VERSION="$VERSION" OUT="dist/${APP}_linux_amd64"
          chmod +x "dist/${APP}_linux_amd64"
          "dist/${APP}_linux_amd64" --version

      # The rpm comes from the same binary, through `wails3 tool package` (nfpm) and
      # build/linux/nfpm/nfpm.yaml, which also installs the .desktop files and the icon.
      - name: Package the rpm
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" make wails3-install
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package-linux.sh "dist/${APP}_linux_amd64" "$VERSION" dist

      # Installing the package proves its dependencies exist on Fedora 44.
      - name: The rpm installs
        run: |
          dnf install -y dist/*.rpm
          kglance --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/${{ env.APP }}_linux_amd64
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  # CycloneDX SBOM from the lockfiles (go.mod/go.sum and frontend/package-lock.json). Named without
  # os/arch so it cannot be mistaken for the binary. security.yml does the vulnerability scanning.
  sbom:
    name: SBOM
    needs: meta
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          scanners: license
          version: ${{ env.TRIVY_VERSION }}
          output: ${{ runner.temp }}/sbom.cdx.json
          skip-dirs: frontend/node_modules,dist

      - name: Name the SBOM
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p sbom
          cp "$RUNNER_TEMP/sbom.cdx.json" "sbom/${APP}_${VERSION}.sbom.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: [meta, checks, build, sbom]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # update the draft release, upload assets and publish it
      pull-requests: read # Release Drafter reads the merged PRs
      id-token: write # sign the provenance attestation
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist

      # SHA256SUMS lists every download.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*_linux_amd64
            dist/*.rpm
            dist/*.sbom.cdx.json

      # Unlike subject-path, sbom-path takes one literal path (no glob), so resolve it first.
      - name: Locate SBOM
        id: sbom
        run: echo "path=$(ls dist/*.sbom.cdx.json)" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*_linux_amd64
          sbom-path: ${{ steps.sbom.outputs.path }}

      # Fail the release if what was just signed does not verify against this workflow.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for f in dist/*_linux_amd64 dist/*.rpm dist/*.sbom.cdx.json; do
            gh attestation verify "$f" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml"
          done
          gh attestation verify dist/*_linux_amd64 --repo "$REPO" \
            --predicate-type https://cyclonedx.org/bom

      # The notes come from Release Drafter (.github/release-drafter.yml). Aimed at the built commit, it
      # writes the draft for exactly this tag, from the PRs merged since the last published release up to
      # that commit, so a retried release gets the notes of the commit that was built.
      - name: Draft the release notes
        id: notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          tag: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          commitish: ${{ needs.meta.outputs.sha }}
          prerelease: ${{ needs.meta.outputs.prerelease }}

      # Assets go onto the draft and the draft is then published, so the release appears complete. `gh`
      # finds a draft by its pending tag name, so if release-drafter.yml retargets the draft to another
      # version meanwhile, these calls fail to find it and nothing is published, instead of publishing
      # the wrong tag.
      - name: Attach the build and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.version }}
          TARGET: ${{ needs.meta.outputs.sha }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          # A retry finds the assets of an earlier, failed attempt on the draft; --clobber replaces them.
          gh release upload "$TAG" dist/* --clobber

          latest=true
          [ "$PRERELEASE" = true ] && latest=false
          # Publishing creates the tag when it does not exist yet, at the draft's target. --target sets that
          # to the built commit in the same call, because release-drafter.yml may have moved the draft to
          # the head of main since the notes step. A tag that already exists is used as it is.
          printf '%s' "$NOTES" | gh release edit "$TAG" --target "$TARGET" --draft=false \
            --prerelease="$PRERELEASE" --latest="$latest" --title "$TAG" --notes-file -
          echo "Published $TAG"
